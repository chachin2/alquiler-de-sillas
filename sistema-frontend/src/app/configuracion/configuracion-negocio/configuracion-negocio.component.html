<div class="max-w-4xl mx-auto pb-10">
  <!-- Tabs -->
  <div class="flex space-x-1 bg-surface-200/50 dark:bg-surface-800/50 p-1 rounded-xl mb-6 backdrop-blur-sm border border-surface-200 dark:border-surface-700">
    <button class="flex-1 py-2.5 px-4 rounded-lg text-sm font-bold transition-all duration-200"
            [ngClass]="vistaActual === 'negocio' ? 'bg-white dark:bg-surface-700 text-primary-600 dark:text-primary-400 shadow-sm' : 'text-surface-500 hover:text-surface-700 dark:hover:text-surface-300'"
            (click)="vistaActual = 'negocio'">
      Empresa
    </button>
    <button class="flex-1 py-2.5 px-4 rounded-lg text-sm font-bold transition-all duration-200"
            [ngClass]="vistaActual === 'usuarios' ? 'bg-white dark:bg-surface-700 text-primary-600 dark:text-primary-400 shadow-sm' : 'text-surface-500 hover:text-surface-700 dark:hover:text-surface-300'"
            (click)="vistaActual = 'usuarios'">
      Usuarios
    </button>
  </div>

  <div *ngIf="mensaje.texto" class="alert animate-[fadeIn_0.3s_ease-out]" [ngClass]="mensaje.tipo === 'error' ? 'error-alert' : 'success-alert'">
    {{ mensaje.texto }}
  </div>

  <!-- PESTAÑA EMPRESA -->
  <div *ngIf="vistaActual === 'negocio'" class="card animate-[fadeIn_0.3s_ease-out]">
    <h2 class="text-lg font-bold text-surface-900 dark:text-white mb-6 pb-2 border-b border-surface-100 dark:border-surface-700">Configuración del Negocio</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="flex justify-center mb-6">
        <div class="w-32 h-32 rounded-full border-4 border-white dark:border-surface-800 shadow-soft overflow-hidden bg-surface-100 dark:bg-surface-700 flex justify-center items-center relative group">
          <img [src]="logoPreview" alt="Logo del Negocio" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="material-symbols-outlined text-white text-3xl">upload</span>
          </div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="logoUpload">Subir Logo:</label>
        <input id="logoUpload" type="file" accept="image/*" (change)="onFileSelected($event)" class="file-input">
        <input type="hidden" formControlName="logo">
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div class="form-group mb-0">
          <label for="nombreNegocio">Nombre del Negocio:</label>
          <input id="nombreNegocio" formControlName="nombre">
        </div>
        <div class="form-group mb-0">
          <label for="direccionNegocio">Dirección:</label>
          <input id="direccionNegocio" formControlName="direccion">
        </div>
      </div>
      
      <div class="mt-6">
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
      </div>
    </form>
    
    <div class="mt-10 pt-6 border-t border-surface-200 dark:border-surface-700 flex justify-end">
      <button type="button" class="btn btn-secondary" (click)="logout()">Cerrar Sesión</button>
    </div>
  </div>

  <!-- PESTAÑA USUARIOS -->
  <div *ngIf="vistaActual === 'usuarios'" class="animate-[fadeIn_0.3s_ease-out]">
    
    <!-- NUEVO USUARIO -->
    <div class="card mb-6">
      <h2 class="text-lg font-bold text-surface-900 dark:text-white mb-6 pb-2 border-b border-surface-100 dark:border-surface-700">Crear Nuevo Usuario</h2>
      <form [formGroup]="newUserForm" (ngSubmit)="crearUsuario()">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
          <div class="form-group mb-0">
            <label>Nombre de Usuario</label>
            <input type="text" formControlName="username" placeholder="ej. admin2">
          </div>
          <div class="form-group mb-0">
            <label>Contraseña</label>
            <input type="password" formControlName="password" placeholder="Min. 4 caracteres">
          </div>
        </div>
        
        <div class="form-group mt-6">
          <label>Permisos de Acceso a Módulos</label>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3 bg-surface-50 dark:bg-surface-800/50 p-4 rounded-xl border border-surface-200 dark:border-surface-700">
            <label class="flex items-center gap-2 text-sm font-medium text-surface-700 dark:text-surface-300 cursor-pointer">
              <input type="checkbox" formControlName="mod_dashboard" class="w-4 h-4 rounded border-surface-300 text-primary-600 focus:ring-primary-500"> Dashboard
            </label>
            <label class="flex items-center gap-2 text-sm font-medium text-surface-700 dark:text-surface-300 cursor-pointer">
              <input type="checkbox" formControlName="mod_inventario" class="w-4 h-4 rounded border-surface-300 text-primary-600 focus:ring-primary-500"> Inventario
            </label>
            <label class="flex items-center gap-2 text-sm font-medium text-surface-700 dark:text-surface-300 cursor-pointer">
              <input type="checkbox" formControlName="mod_gestiones" class="w-4 h-4 rounded border-surface-300 text-primary-600 focus:ring-primary-500"> Reservas/Agenda
            </label>
            <label class="flex items-center gap-2 text-sm font-medium text-surface-700 dark:text-surface-300 cursor-pointer">
              <input type="checkbox" formControlName="mod_edicion" class="w-4 h-4 rounded border-surface-300 text-primary-600 focus:ring-primary-500"> Edición
            </label>
            <label class="flex items-center gap-2 text-sm font-medium text-surface-700 dark:text-surface-300 cursor-pointer">
              <input type="checkbox" formControlName="mod_configuracion" class="w-4 h-4 rounded border-surface-300 text-primary-600 focus:ring-primary-500"> Configuración
            </label>
            <label class="flex items-center gap-2 text-sm font-medium text-surface-700 dark:text-surface-300 cursor-pointer">
              <input type="checkbox" formControlName="mod_auditoria" class="w-4 h-4 rounded border-surface-300 text-primary-600 focus:ring-primary-500"> Auditoría
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary mt-4" [disabled]="newUserForm.invalid">Crear Usuario</button>
      </form>
    </div>

    <!-- LISTA DE USUARIOS -->
    <div class="card">
      <h2 class="text-lg font-bold text-surface-900 dark:text-white mb-6 pb-2 border-b border-surface-100 dark:border-surface-700">Usuarios Registrados</h2>
      
      <div class="space-y-3">
        <div class="flex items-center justify-between p-4 bg-surface-50 dark:bg-surface-800/50 rounded-lg border border-surface-200 dark:border-surface-700 transition-colors hover:bg-surface-100 dark:hover:bg-surface-800" *ngFor="let u of usuarios">
          <div class="flex items-center text-surface-700 dark:text-surface-200">
            <span class="material-symbols-outlined text-surface-400 mr-3">person</span>
            <strong class="font-semibold">{{ u.username }}</strong>
          </div>
          <div class="flex items-center gap-2">
            <button class="btn btn-sm btn-secondary" (click)="iniciarCambioPassword(u)">Cambiar Clave</button>
            <button class="btn btn-sm btn-danger" (click)="eliminarUsuario(u.id!)" *ngIf="u.username !== 'admin'">Eliminar</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- MODAL CAMBIO PASSWORD -->
  <div class="fixed inset-0 bg-surface-900/60 backdrop-blur-sm flex justify-center items-center z-[1000] p-4" *ngIf="usuarioAEditar">
    <div class="bg-white dark:bg-surface-800 p-6 rounded-xl w-full max-w-sm shadow-[0_20px_25px_-5px_rgba(0,0,0,0.1)] relative">
      <div class="flex justify-between items-center mb-5 border-b border-surface-100 dark:border-surface-700 pb-3">
        <h3 class="text-lg font-bold text-surface-900 dark:text-white m-0">Cambiar Contraseña</h3>
        <button class="text-surface-400 hover:text-surface-600 dark:hover:text-surface-300 text-2xl leading-none" (click)="cancelarCambioPassword()">&times;</button>
      </div>
      <p class="text-sm text-surface-500 mb-4">Usuario: <strong class="text-surface-700 dark:text-surface-300">{{ usuarioAEditar.username }}</strong></p>
      
      <form [formGroup]="changePasswordForm" (ngSubmit)="confirmarCambioPassword()">
        <div class="form-group">
          <label>Nueva Contraseña</label>
          <input type="password" formControlName="password" placeholder="Ingrese nueva contraseña">
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" class="btn btn-secondary" (click)="cancelarCambioPassword()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="changePasswordForm.invalid">Actualizar</button>
        </div>
      </form>
    </div>
  </div>

</div>
